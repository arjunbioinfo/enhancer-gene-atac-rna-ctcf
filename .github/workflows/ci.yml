name: CI — Enhancer-Gene ATAC/RNA/CTCF Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -v tests/

      - name: Run Snakemake pipeline on real ENCODE chr8 data (K562 vs GM12878)
        run: |
          snakemake --cores 2 --configfile config/ci.yaml --config _config_path=config/ci.yaml

      - name: Verify expected outputs
        run: |
          test -s results/enhancer_gene_links.tsv
          test -s results/gene_regulatory_summary.tsv
          test -s results/ctcf_enrichment_stats.tsv
          test -s results/prioritized_candidates.tsv
          test -s figures/atac_rna_correlation.png
          test -s figures/ctcf_enrichment.png
          test -s figures/distance_to_ctcf.png
          test -s figures/top_candidates_summary.png

      - name: Upload CI figures and summary tables
        uses: actions/upload-artifact@v4
        with:
          name: ci-chr8-outputs
          path: |
            results/ctcf_enrichment_stats.tsv
            results/prioritized_candidates.tsv
            figures/*.png
