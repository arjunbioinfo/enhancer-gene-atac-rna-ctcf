# Fast CI configuration: real public ENCODE GRCh38 data (K562 vs GM12878)
# Restricted to chr8 (includes the MYC / CCAT1 / PVT1 8q24.21 regulatory locus)

_config_path: "config/ci.yaml"

comparison:
  condition_a: "K562"
  condition_b: "GM12878"

genome:
  assembly: "GRCh38"
  gencode_gtf_url: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_29/gencode.v29.basic.annotation.gtf.gz"

chromosomes:
  - "chr8"

encode:
  K562:
    atac_experiment: "ENCSR483RKN"
    ctcf_experiment: "ENCSR000DWE"
    rna_experiment: "ENCSR000AEM"
  GM12878:
    atac_experiment: "ENCSR095QNB"
    ctcf_experiment: "ENCSR000DZN"
    rna_experiment: "ENCSR000AED"

annotation:
  biotypes:
    - "protein_coding"
    - "lincRNA"
    - "antisense"

parameters:
  promoter_window_bp: 2000
  enhancer_max_distance_bp: 250000
  ctcf_proximity_bp: 1000
  min_tpm: 1.0
  deg_log2fc_threshold: 1.0
  atac_log2fc_threshold: 1.0
  random_seed: 42

plotting:
  highlight_genes:
    - "MYC"
    - "PVT1"
    - "CCAT1"
    - "BLK"
    - "TRIB1"

output_dirs:
  data: "data/raw"
  results: "results"
  figures: "figures"
